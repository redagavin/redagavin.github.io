{% comment %}Set the theme before first paint: the visitor's saved choice, else the system setting.
No line comments in inline scripts: the compress layout joins lines in production.{% endcomment %}
<script>
  (function () {
    var theme;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
